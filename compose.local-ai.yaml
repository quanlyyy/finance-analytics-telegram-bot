services:
  api:
    environment:
      AI_WORKER_URL: http://ai-worker:8080
  bot:
    environment:
      AI_WORKER_URL: http://ai-worker:8080
  ai-worker:
    build: ./ai_worker
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - speech-models:/models
    mem_limit: 768m
    cpus: 0.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
  ollama:
    image: ollama/ollama@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '0'
      OLLAMA_CONTEXT_LENGTH: '2048'
    volumes:
      - chat-models:/root/.ollama
    mem_limit: 900m
    cpus: 0.7
    restart: unless-stopped
volumes:
  speech-models:
  chat-models:
